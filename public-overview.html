<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>PENSION LAB · 자산 조회</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/pension-lab.css">
  <script src="/js/public-overview.js" defer></script>
</head>
<body>
  <header class="lab-header">
    <strong>PENSION LAB</strong>
    <div class="lab-header-actions">
      <a href="/manage">관리</a>
      <div class="lab-theme-picker" role="group" aria-label="화면 테마">
        <button type="button" data-lab-theme="dark" aria-pressed="true">다크</button>
        <button type="button" data-lab-theme="light" aria-pressed="false">화이트</button>
      </div>
    </div>
  </header>
  <main class="lab-public">
    <div class="lab-heading lab-dashboard-title">
      <div><h1>우리 집 자산</h1><span id="publicAssetPeriod"></span></div>
      <button id="publicAssetRefresh" type="button">새로고침</button>
    </div>
    <p id="publicAssetStatus" role="status">자산 요약을 불러오는 중입니다.</p>
    <div id="publicAssetSummary" hidden>
      <div class="lab-totals">
        <div class="card"><span>순자산</span><strong id="publicNet"></strong></div>
        <div class="card"><span>총자산</span><strong id="publicAssets"></strong></div>
        <div class="card"><span>총부채</span><strong id="publicDebt"></strong></div>
      </div>
      <section class="lab-section lab-portfolio">
        <h2>자산 포트폴리오</h2>
        <div id="publicAllocation" class="lab-bar" aria-hidden="true"></div>
        <div id="publicCategories"></div>
      </section>
    </div>
  </main>
</body>
</html>
